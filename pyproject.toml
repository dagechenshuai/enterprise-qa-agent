[project]
name = "enterprise-qa-agent"
version = "0.1.0"
description = "带原文引用、冲突查证和执行预算的企业制度问答 CLI"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.10,<3", "jieba==0.42.1", "python-dotenv>=1.0,<2"]

[project.scripts]
enterprise-qa = "enterprise_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_qa"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "black>=25,<26", "isort>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.isort]
profile = "black"

[tool.uv]
package = true
